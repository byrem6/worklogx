<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/worklogx/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta content="worklog" name="description">
  <meta content="#FFFFFF" media="(prefers-color-scheme: light)" name="theme-color">
  <!-- iOS meta tags & icons -->
  <meta content="yes" name="mobile-web-app-capable">
  <meta content="default" name="apple-mobile-web-app-status-bar-style">
  <meta content="Worklog" name="apple-mobile-web-app-title">
  <link href="icons/Icon-192.png" rel="apple-touch-icon">

  <!-- Favicon -->
  <link href="favicon.png" rel="icon" type="image/png"/>

  <title>Worklog</title>
  <link href="manifest.json" rel="manifest">

  <style>
    body {
height: 100vh;
display: flex;
align-items: center;
justify-content: center;
}


.u-loading__symbol img {
display: block;
max-width: 100%;
animation: loading-icon 0.6s infinite;
}

@keyframes loading-icon {
0% {
transform: perspective(250px) rotateX(0deg) rotateY(0deg);
}
15% {
transform: perspective(250px) rotateX(0deg) rotateY(15deg);
}
30% {
transform: perspective(250px) rotateX(0deg) rotateY(30deg);
}
45% {
transform: perspective(250px) rotateX(0deg) rotateY(45deg);
}
60% {
transform: perspective(250px) rotateX(0deg) rotateY(60deg);
}
75% {
transform: perspective(250px) rotateX(0deg) rotateY(75deg);
}
90% {
transform: perspective(250px) rotateX(0deg) rotateY(90deg);
}
100% {
transform: perspective(250px) rotateX(0deg) rotateY(105deg);
}
}
  </style>
</head>
<body>
<div class="u-loading" id="loader">
  <div class="u-loading__symbol">
    <img alt="Logo" height="36" src="logo.png" width="160">
  </div>
</div>
<script async src="flutter_bootstrap.js?v=32"></script>
</body>
</html>
