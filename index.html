<!DOCTYPE html>
<html lang="en">
<head>
    <base href="/worklogx/">

    <meta charset="UTF-8">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <meta content="Worklog" name="description">
    <meta content="#0F172A" name="theme-color">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">

    <title>Worklog</title>

    <link href="manifest.json" rel="manifest">
    <link href="favicon.png" rel="icon" type="image/png">
    <link href="icons/Icon-192.png" rel="apple-touch-icon">

    <!-- Google Identity -->
    <meta content="498252822563-4ddhnmognklt7qopn69cmuarofuedifb.apps.googleusercontent.com"
          name="google-signin-client_id">
    <script async defer src="https://accounts.google.com/gsi/client"></script>

    <script>
        window.googleClientId =
          '498252822563-4ddhnmognklt7qopn69cmuarofuedifb.apps.googleusercontent.com';
    </script>

    <style>
        /* ---------------------------
           GLOBAL RESET (SAFE)
        --------------------------- */
        html, body {
          margin: 0;
          padding: 0;
          height: 100%;
          background: #0F172A;
        }

        /* ---------------------------
           LOADER CONTAINER
        --------------------------- */
        #app-loader {
          position: fixed;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          background: radial-gradient(
            circle at center,
            #0F172A 0%,
            #020617 100%
          );
          z-index: 9999;
          transition: opacity 0.6s ease, visibility 0.6s ease;
        }

        #app-loader.hidden {
          opacity: 0;
          visibility: hidden;
        }

        /* ---------------------------
           LOGO + ANIMATION
        --------------------------- */
        .loader-content {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 16px;
        }

        .loader-logo {
          width: 160px;
          height: auto;
          animation: logo-float 2.2s ease-in-out infinite;
          filter: drop-shadow(0 8px 24px rgba(0,0,0,0.45));
        }

        .loader-ring {
          width: 36px;
          height: 36px;
          border-radius: 50%;
          border: 3px solid rgba(255,255,255,0.15);
          border-top-color: #38BDF8;
          animation: spin 0.9s linear infinite;
        }

        /* ---------------------------
           ANIMATIONS
        --------------------------- */
        @keyframes spin {
          to { transform: rotate(360deg); }
        }

        @keyframes logo-float {
          0%, 100% {
            transform: translateY(0);
            opacity: 0.85;
          }
          50% {
            transform: translateY(-6px);
            opacity: 1;
          }
        }

        /* ---------------------------
           REDUCED MOTION SUPPORT
        --------------------------- */
        @media (prefers-reduced-motion: reduce) {
          .loader-logo,
          .loader-ring {
            animation: none;
          }
        }
    </style>
</head>

<body>
<!-- LOADER -->
<div aria-label="Loading application" id="app-loader" role="status">
    <div class="loader-content">
        <img
                alt="Worklog"
                class="loader-logo"
                src="logo.png"
        />
        <div class="loader-ring"></div>
    </div>
</div>

<!-- FLUTTER BOOTSTRAP -->
<script>
    // Flutter hazır olunca loader'ı kaldır
    window.addEventListener('flutter-first-frame', function () {
      const loader = document.getElementById('app-loader');
      if (loader) loader.classList.add('hidden');
    });
</script>

<script async src="flutter_bootstrap.js?v=43"></script>
</body>
</html>
